<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/1.png" />
    <link rel="manifest" href="/manifest.webmanifest?v=2" />
    <link rel="apple-touch-icon" href="/1.png" />
    <meta name="application-name" content="نبض التمريض" />
    <meta name="apple-mobile-web-app-title" content="نبض التمريض" />
    <meta name="theme-color" content="#020818" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>نبض التمريض — أحمد محرم</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#020818',
                        surface: '#0d1f3c',
                        primary: '#00d4ff',
                        secondary: '#22d3ee',
                        accent: '#38bdf8',
                        gold: '#f59e0b',
                        dark: '#020818',
                        subtle: '#64748b',
                        muted: '#1e3a5f',
                        card: '#0a1929',
                    },
                    fontFamily: { cairo: ['Cairo', 'sans-serif'] },
                    boxShadow: {
                        'glow': '0 0 40px -5px rgba(0,212,255,0.5)',
                        'glow-lg': '0 0 80px -10px rgba(0,212,255,0.4)',
                        'card': '0 4px 20px rgba(0,0,0,0.5)',
                        'card-hover': '0 25px 60px rgba(0,212,255,0.18)',
                    },
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Cairo', sans-serif;
            background: #020818;
            color: #f0f9ff;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ─── GPU layer for animated elements ─── */
        .gpu { transform: translateZ(0); will-change: transform; }

        /* ─── Glassmorphism ─── */
        .glass {
            background: rgba(13,31,60,0.55);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(0,212,255,0.18);
        }
        .glass-light {
            background: rgba(255,255,255,0.035);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.07);
        }

        /* ─── Gradient text ─── */
        .gradient-text {
            background: linear-gradient(135deg, #00d4ff 0%, #7dd3fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .gradient-text-warm {
            background: linear-gradient(135deg, #f59e0b 0%, #fde68a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ─── Neon text ─── */
        .text-neon { color: #00d4ff; text-shadow: 0 0 15px rgba(0,212,255,0.7); }

        /* ─── Shimmer CTA button ─── */
        @keyframes shimmerBg {
            0% { background-position: 200% center; }
            100% { background-position: -200% center; }
        }
        .shimmer-btn {
            background: linear-gradient(90deg, #00b4d8, #00d4ff, #7dd3fc, #00d4ff, #00b4d8);
            background-size: 300% auto;
            animation: shimmerBg 4s linear infinite;
            color: #020818;
        }

        .sphere-scene {
            perspective: 900px;
            perspective-origin: 50% 50%;
        }
        .sphere-wrapper {
            position: relative;
            transform-style: preserve-3d;
            animation: sphereRotate 25s linear infinite;
        }
        @keyframes sphereRotate {
            from { transform: rotateY(0deg); }
            to   { transform: rotateY(360deg); }
        }
        .ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            transform-style: preserve-3d;
        }
        .ring-1 { animation: ring1 7s linear infinite; }
        .ring-2 { animation: ring2 11s linear infinite; }
        .ring-3 { animation: ring3 16s linear infinite reverse; }
        @keyframes ring1 {
            from { transform: rotateX(75deg) rotateZ(0deg); }
            to   { transform: rotateX(75deg) rotateZ(360deg); }
        }
        @keyframes ring2 {
            from { transform: rotateX(75deg) rotateZ(120deg); }
            to   { transform: rotateX(75deg) rotateZ(480deg); }
        }
        @keyframes ring3 {
            from { transform: rotateX(50deg) rotateY(20deg) rotateZ(240deg); }
            to   { transform: rotateX(50deg) rotateY(20deg) rotateZ(600deg); }
        }

        /* Sphere inner pulse */
        @keyframes spherePulse {
            0%, 100% { box-shadow: 0 0 60px rgba(0,212,255,0.25), inset 0 0 40px rgba(0,212,255,0.08); }
            50%       { box-shadow: 0 0 110px rgba(0,212,255,0.45), inset 0 0 70px rgba(0,212,255,0.15); }
        }
        .sphere-inner { animation: spherePulse 4s ease-in-out infinite; }

        /* ─── Card 3D tilt ─── */
        .card-3d {
            transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1), box-shadow 0.4s ease;
            transform-style: preserve-3d;
        }
        .card-3d:hover {
            transform: perspective(800px) rotateX(-4deg) rotateY(4deg) translateY(-8px);
            box-shadow: 0 30px 70px rgba(0,212,255,0.18), 0 0 0 1px rgba(0,212,255,0.2);
        }
        .card-3d-shine {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            opacity: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 60%);
            transition: opacity 0.4s ease;
            pointer-events: none;
        }
        .card-3d:hover .card-3d-shine { opacity: 1; }

        /* ─── ECG ─── */
        @keyframes ecgDash {
            from { stroke-dashoffset: 1200; }
            to   { stroke-dashoffset: 0; }
        }
        .ecg-path {
            stroke-dasharray: 1200;
            stroke-dashoffset: 1200;
            animation: ecgDash 3.5s linear infinite;
        }

        /* ─── Aurora blobs ─── */
        @keyframes blobFloat {
            0%, 100% { transform: translate(0,0) scale(1); }
            33%       { transform: translate(30px,-40px) scale(1.05); }
            66%       { transform: translate(-20px, 20px) scale(0.97); }
        }
        .blob { animation: blobFloat var(--dur,15s) ease-in-out infinite var(--delay,0s); }

        /* ─── Floating particles ─── */
        @keyframes particleDrift {
            0%, 100% { transform: translateY(0) translateX(0) scale(1); opacity: 0.5; }
            50%       { transform: translateY(-28px) translateX(12px) scale(1.2); opacity: 1; }
        }
        .particle { animation: particleDrift var(--dur,7s) ease-in-out infinite var(--delay,0s); }

        /* ─── Ping (live dot) ─── */
        @keyframes pingRing {
            0%   { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(2.4); opacity: 0; }
        }
        .ping-ring        { animation: pingRing 2.4s cubic-bezier(0,0,0.2,1) infinite; }
        .ping-ring-delay  { animation: pingRing 2.4s cubic-bezier(0,0,0.2,1) infinite 1.2s; }

        /* ─── Stat card ─── */
        .stat-card {
            background: linear-gradient(135deg, rgba(0,212,255,0.08), rgba(0,212,255,0.03));
            border: 1px solid rgba(0,212,255,0.16);
        }

        /* ─── Card premium ─── */
        .card-premium {
            background: linear-gradient(145deg, rgba(13,31,60,0.92), rgba(10,20,40,0.96));
            border: 1px solid rgba(0,212,255,0.18);
        }

        /* ─── Scrollbar ─── */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #020818; }
        ::-webkit-scrollbar-thumb { background: rgba(0,212,255,0.25); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0,212,255,0.55); }

        /* ─── scan line ─── */
        @keyframes scanLine {
            0%   { top: -5%; }
            100% { top: 105%; }
        }
        .scan-line {
            position: absolute; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0,212,255,0.5), transparent);
            animation: scanLine 6s ease-in-out infinite;
            pointer-events: none;
        }
        /* ─── Orbit tiny dots ─── */
        @keyframes orbitDot {
            from { transform: rotate(0deg) translateX(130px) rotate(0deg); }
            to   { transform: rotate(360deg) translateX(130px) rotate(-360deg); }
        }
        .orbit-dot-1 { animation: orbitDot 6s linear infinite; }
        .orbit-dot-2 { animation: orbitDot 9s linear infinite reverse; }
    </style>
